apiVersion: batch/v1
kind: Job
metadata:
  name: shopverse-migrate
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: shopverse
    app.kubernetes.io/instance: shopverse
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopverse
        app.kubernetes.io/instance: shopverse
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: shopverse
      containers:
        - name: migrate
          image: ${BACKEND_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - "cd backend && npx prisma migrate deploy --schema=../prisma/schema"
          envFrom:
            - configMapRef:
                name: shopverse-config
            - secretRef:
                name: shopverse-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopverse-backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: shopverse
    app.kubernetes.io/instance: shopverse
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shopverse
      app.kubernetes.io/instance: shopverse
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopverse
        app.kubernetes.io/instance: shopverse
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: shopverse
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args: ["cd backend && node dist/main"]
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            # With dedicated worker pods (20-worker-deployment.yaml), the
            # backend pauses its own consumers. Producer-side enqueue still works.
            - name: DISABLE_WORKERS
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: shopverse-backend
          envFrom:
            - configMapRef:
                name: shopverse-config
            - secretRef:
                name: shopverse-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

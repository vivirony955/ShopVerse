apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopverse-frontend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: shopverse
    app.kubernetes.io/instance: shopverse
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shopverse
      app.kubernetes.io/instance: shopverse
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopverse
        app.kubernetes.io/instance: shopverse
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: shopverse
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "https://${INGRESS_HOST}"
            # Server-reachable backend URL for SSR / NextAuth authorize (NOT the
            # browser URL above). In-cluster Service DNS; must include /api.
            # See frontend/src/lib/server-api.ts.
            - name: BACKEND_INTERNAL_URL
              value: "http://shopverse-backend/api"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: shopverse-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: shopverse
    app.kubernetes.io/instance: shopverse
data:
  NODE_ENV: "production"
  CORS_ORIGIN: "https://${INGRESS_HOST}"
  # Uncomment to enable OpenTelemetry tracing.
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
  # OTEL_TRACES_SAMPLER_ARG: "0.1"
  # SENTRY_ENVIRONMENT: "production"

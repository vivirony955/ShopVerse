apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopverse
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: shopverse
    app.kubernetes.io/instance: shopverse
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100k
spec:
  ingressClassName: nginx
  # Uncomment when cert-manager is in place
  # tls:
  #   - hosts:
  #       - ${INGRESS_HOST}
  #     secretName: shopverse-tls
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: shopverse-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopverse-frontend
                port:
                  number: 80

# ShopVerse — Ephemeral CI Stack
#
# Boots postgres + redis + backend + frontend on the CI runner so the
# Playwright suite, Lighthouse, and k6 perf checks have a real target.
# Used by .github/workflows/e2e-stack.yml and .gitlab-ci.yml's e2e:stack
# job. NOT for production — see docker-compose.yml for that.
#
# Differences from production compose:
#   - No restart policy (CI fails fast)
#   - Aggressive healthcheck intervals (5s vs 30s — runners are impatient)
#   - Postgres trust auth + ephemeral data (no volume)
#   - All env values are dummies inlined here; no .env required
#   - PORT explicitly set for backend (production compose has a 3001/4000
#     port-mismatch bug — fixed here)
#   - connection_limit=10 matches what Lighthouse/k6 will exercise
#
# Smoke usage (locally):
#   docker compose -f docker-compose.ci.yml up -d
#   docker compose -f docker-compose.ci.yml exec -T backend sh -c "cd backend && node dist/src/prisma/seed.js"
#   docker compose -f docker-compose.ci.yml exec -T backend sh -c "cd backend && node dist/src/prisma/e2e-seed.js"
#   curl -fsS http://localhost:3001/api/health
#   curl -fsS http://localhost:3000
#   docker compose -f docker-compose.ci.yml down -v

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopverse_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopverse_ci"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopverse_ci?connection_limit=10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ci-jwt-secret-32-chars-minimum-ok
      JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-min-ok
      STRIPE_SECRET_KEY: sk_test_dummy_ci_value_not_used
      STRIPE_WEBHOOK_SECRET: whsec_dummy_ci_value_not_used
      SMTP_HOST: localhost
      SMTP_PORT: "25"
      SMTP_USER: ci@shopverse.dev
      SMTP_PASS: ci-pass
      SMTP_FROM: ci@shopverse.dev
      CORS_ORIGIN: http://localhost:3000
      # The Playwright suite makes many logins from a single runner IP; raise
      # the strict 5/min auth limiter so it doesn't 401 mid-run (prod keeps 5).
      AUTH_THROTTLE_LIMIT: "1000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Dedicated BullMQ worker process — same image as backend, different entrypoint
  # (node dist/src/worker). Boots it in CI so the worker path + its dist/src/
  # layout + Redis wiring are verified, not just the API. depends_on backend so
  # migrations have run.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd backend && node dist/src/worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopverse_ci?connection_limit=10
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: "9091"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      # Context is the repo root so the file:../packages/sdk-frontend dep is
      # inside the build context (frontend/Dockerfile builds its dist first).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # BROWSER-reachable URLs baked into the client bundle. The browser runs
        # on the runner host, so it reaches the backend via the mapped host
        # port (localhost:3001), NOT the Docker-network hostname. Both carry the
        # /api global prefix.
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_BACKEND_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-jwt-secret-32-chars-minimum-ok
      # SERVER-side calls (NextAuth authorize, SSR/SEO fetches, entitlements)
      # run inside this container → reach the backend over the Docker network
      # at the service hostname, not the host port. Runtime (non-public) so it
      # overrides the build-time NEXT_PUBLIC_* for server code only.
      BACKEND_INTERNAL_URL: http://backend:3001/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (not localhost): Next standalone binds IPv4 0.0.0.0 only;
      # `localhost` resolves to IPv6 ::1 in alpine → connection refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

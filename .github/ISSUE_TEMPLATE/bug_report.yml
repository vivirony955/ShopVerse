name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out all fields — incomplete reports slow down triage.

        **Security vulnerability?** Do NOT use this form. Email vivironycrazy@gmail.com instead. See [SECURITY.md](../SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Create an order with wallet payment
        2. Cancel the order
        3. Check wallet balance...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages and stack traces.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Orders / Order Lifecycle
        - Payments / Stripe
        - Wallet / Refunds
        - Inventory / Warehouse Routing
        - Cart / Reservation
        - Authentication / Auth
        - Loyalty / Points
        - Flash Sales
        - Fraud Detection
        - Admin / RBAC
        - Frontend / UI
        - Database / Migrations
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: "20.x"
    validations:
      required: true

  - type: input
    id: pg-version
    attributes:
      label: PostgreSQL Version
      placeholder: "16.x"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Logs, screenshots, or anything else relevant.

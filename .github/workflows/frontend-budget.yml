name: Frontend Budgets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bundle-size:
    name: W5.T2 — Bundle Size Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build sdk-frontend (file:../packages/sdk-frontend needs dist/)
        run: cd packages/sdk-frontend && npm ci && npx tsc
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Bundle size budget gate
        run: cd frontend && npm run bundle:check
      - name: Hydration weight per-page gate
        run: cd frontend && npm run hydration:check

  lighthouse:
    name: W5.T10 — Lighthouse Delta Gate (scaffolded)
    runs-on: ubuntu-latest
    # Activated when W6 provisions a reachable staging URL. Until
    # then the script self-skips (exit 0) when LIGHTHOUSE_BASE_URL
    # is unset — see frontend/scripts/check-lighthouse.js.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Lighthouse delta gate
        run: cd frontend && npm run lighthouse:check
        env:
          LIGHTHOUSE_BASE_URL: ${{ vars.LIGHTHOUSE_BASE_URL }}

  a11y:
    name: W5.T5 — Slot a11y Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build sdk-frontend
        run: cd packages/sdk-frontend && npm ci && npx tsc
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install root deps (jest + RTL hoisted to repo root)
        run: npm install --no-audit --no-fund
      - name: jest-axe a11y gate
        run: cd frontend && npm test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: TypeScript check
        run: cd backend && npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: ESLint
        run: cd backend && npm run lint

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopverse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopverse_test
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-chars
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Install test deps
        run: cd test && npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Apply migrations
        run: cd backend && npx prisma migrate deploy --schema=../prisma/schema.prisma
      - name: Run integration tests
        run: cd test && npx jest --runInBand --forceExit --passWithNoTests
        timeout-minutes: 15

  schema:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    env:
      # Prisma validate resolves env() in schema.prisma but never opens a connection.
      # A dummy value is sufficient; no real database is needed.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Validate schema
        run: npx prisma validate --schema prisma/schema.prisma

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: shopverse-sbom.cyclonedx.json
          # Skip the action's built-in artifact upload; we upload below
          # so we control the retention window.
          upload-artifact: false
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: shopverse-sbom
          path: shopverse-sbom.cyclonedx.json
          retention-days: 90

  helm-lint:
    # A3: validate the Helm chart on every PR. Renders default + production
    # example values and pipes through `kubeconform` for schema validation
    # against bundled K8s OpenAPI schemas (no cluster needed). Fast (<30s).
    name: Helm chart lint + render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: helm lint
        run: helm lint helm/shopverse
      - name: helm template (defaults) + kubeconform
        run: |
          helm template shopverse helm/shopverse \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: helm template (production example) + kubeconform
        run: |
          helm template shopverse helm/shopverse \
            --values helm/shopverse/values.production.example.yaml \
            --set image.backend.tag=test \
            --set image.frontend.tag=test \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  k8s-validate:
    # A3: validate the raw K8s manifests render cleanly with envsubst, then
    # schema-check each one with kubeconform (offline, no cluster needed).
    name: K8s raw manifests validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: envsubst + kubeconform
        env:
          NAMESPACE: shopverse
          BACKEND_IMAGE: registry.example.com/shopverse/backend:test
          FRONTEND_IMAGE: registry.example.com/shopverse/frontend:test
          INGRESS_HOST: shopverse.example.com
        run: |
          for f in k8s/*.yaml; do
            echo "▶ Validating $f"
            envsubst < "$f" | kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -schema-location default
          done

  sentry-release:
    # A2 observability: upload source maps + create Sentry release on main
    # so production stack traces map back to original TypeScript. Skipped
    # on PR builds (no secret access) and when SENTRY_AUTH_TOKEN is unset
    # (e.g. forks). Build must succeed before upload runs.
    name: Sentry Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, lint, test, schema]
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Skip if Sentry not configured
        id: gate
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Sentry secrets not set — skipping release upload"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install + build backend
        if: steps.gate.outputs.skip == 'false'
        run: |
          cd backend && npm ci && npm run build
      - name: Create Sentry release
        if: steps.gate.outputs.skip == 'false'
        uses: getsentry/action-release@v1
        with:
          environment: production
          version: ${{ github.sha }}
          sourcemaps: ./backend/dist
          url_prefix: '~/dist'

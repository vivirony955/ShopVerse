name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: TypeScript check
        run: cd backend && npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: ESLint
        run: cd backend && npm run lint

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopverse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopverse_test
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-chars
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Install test deps
        run: cd test && npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Apply migrations
        run: cd backend && npx prisma migrate deploy --schema=../prisma/schema.prisma
      - name: Run integration tests
        run: cd test && npx jest --runInBand --forceExit --passWithNoTests
        timeout-minutes: 15

  schema:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    env:
      # Prisma validate resolves env() in schema.prisma but never opens a connection.
      # A dummy value is sufficient; no real database is needed.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Validate schema
        run: npx prisma validate --schema prisma/schema.prisma

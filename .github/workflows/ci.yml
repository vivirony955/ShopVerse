name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-and-backend
      - name: TypeScript check
        run: cd backend && npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-and-backend
      - name: ESLint
        run: cd backend && npm run lint

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopverse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopverse_test
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-chars
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-and-backend
      - name: Install test deps
        run: cd test && npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema
      - name: Apply migrations
        run: cd backend && npx prisma migrate deploy --schema=../prisma/schema
      - name: Run integration tests (with coverage gate)
        # Task 11 / POST_W6 §5.3 — --coverage activates the
        # `coverageThreshold` block in test/jest.config.ts. Numbers there
        # are conservative; a drop > 5 percentage points blocks the
        # build. lcov uploaded below for inspection / future Codecov
        # wiring. GitLab already gates on the same threshold (see
        # `integration` job in .gitlab-ci.yml) — this brings GitHub to
        # parity.
        run: cd test && npx jest --runInBand --forceExit --passWithNoTests --coverage
        timeout-minutes: 15

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: |
            test/coverage/lcov.info
            test/coverage/coverage-summary.json
          retention-days: 30
          if-no-files-found: warn

  schema:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    env:
      # Prisma validate resolves env() in schema.prisma but never opens a connection.
      # A dummy value is sufficient; no real database is needed.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Validate schema
        run: npx prisma validate --schema prisma/schema

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: shopverse-sbom.cyclonedx.json
          # Skip the action's built-in artifact upload; we upload below
          # so we control the retention window.
          upload-artifact: false
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: shopverse-sbom
          path: shopverse-sbom.cyclonedx.json
          retention-days: 90

  helm-lint:
    # A3: validate the Helm chart on every PR. Renders default + production
    # example values and pipes through `kubeconform` for schema validation
    # against bundled K8s OpenAPI schemas (no cluster needed). Fast (<30s).
    #
    # Hardening:
    #   - kubeconform binary cached across runs (saves ~5s and a download)
    #   - download checksum-verified against the release's CHECKSUMS file
    #   - `set -euo pipefail` so a download/extract failure fails the step
    #   - `--max-time 30` on curl so a slow GitHub doesn't hang the job
    #   - No external CRD catalog (chart has no CRDs yet — add the
    #     -schema-location flag back if/when we adopt cert-manager etc.)
    name: Helm chart lint + render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBERNETES_VERSION: 1.30.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Cache kubeconform
        id: cache-kubeconform
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-linux-amd64
      - name: Install kubeconform (checksum-verified)
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          REL="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          ASSET="kubeconform-linux-amd64.tar.gz"
          curl --max-time 30 --fail -sLo "/tmp/${ASSET}" "${REL}/${ASSET}"
          curl --max-time 30 --fail -sLo /tmp/CHECKSUMS "${REL}/CHECKSUMS"
          (cd /tmp && grep " ${ASSET}\$" CHECKSUMS | sha256sum -c -)
          tar -xzf "/tmp/${ASSET}" -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform
          rm -f "/tmp/${ASSET}" /tmp/CHECKSUMS
      - name: Verify kubeconform install
        run: |
          set -euo pipefail
          test -x /usr/local/bin/kubeconform
          kubeconform -v
      - name: helm lint
        run: helm lint helm/shopverse
      - name: helm template (defaults) + kubeconform
        run: |
          set -euo pipefail
          helm template shopverse helm/shopverse \
            | kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}"
      - name: helm template (production example) + kubeconform
        run: |
          set -euo pipefail
          helm template shopverse helm/shopverse \
            --values helm/shopverse/values.production.example.yaml \
            --set image.backend.tag=test \
            --set image.frontend.tag=test \
            | kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}"
      - name: Deploy-config contract — BACKEND_INTERNAL_URL wired everywhere (T-7)
        run: |
          set -euo pipefail
          node scripts/check-deploy-config.mjs
          # Strongest helm check: the RENDERED chart must carry the server URL.
          helm template shopverse helm/shopverse | grep -q "BACKEND_INTERNAL_URL" \
            || { echo "::error::helm render is missing BACKEND_INTERNAL_URL (G-1)"; exit 1; }

  k8s-validate:
    # A3: validate the raw K8s manifests render cleanly with envsubst, then
    # schema-check each one with kubeconform (offline, no cluster needed).
    name: K8s raw manifests validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBERNETES_VERSION: 1.30.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache kubeconform
        id: cache-kubeconform
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-linux-amd64
      - name: Install kubeconform (checksum-verified)
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          REL="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          ASSET="kubeconform-linux-amd64.tar.gz"
          curl --max-time 30 --fail -sLo "/tmp/${ASSET}" "${REL}/${ASSET}"
          curl --max-time 30 --fail -sLo /tmp/CHECKSUMS "${REL}/CHECKSUMS"
          (cd /tmp && grep " ${ASSET}\$" CHECKSUMS | sha256sum -c -)
          tar -xzf "/tmp/${ASSET}" -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform
          rm -f "/tmp/${ASSET}" /tmp/CHECKSUMS
      - name: Verify kubeconform install
        run: |
          set -euo pipefail
          test -x /usr/local/bin/kubeconform
          kubeconform -v
      - name: envsubst + kubeconform
        env:
          NAMESPACE: shopverse
          BACKEND_IMAGE: registry.example.com/shopverse/backend:test
          FRONTEND_IMAGE: registry.example.com/shopverse/frontend:test
          INGRESS_HOST: shopverse.example.com
        run: |
          set -euo pipefail
          for f in k8s/*.yaml; do
            echo "▶ Validating $f"
            envsubst < "$f" | kubeconform -strict -summary \
              -kubernetes-version "${KUBERNETES_VERSION}"
          done

  sentry-release:
    # A2 observability: upload source maps + create Sentry release on main
    # so production stack traces map back to original TypeScript. Skipped
    # on PR builds (no secret access) and when SENTRY_AUTH_TOKEN is unset
    # (e.g. forks). Build must succeed before upload runs.
    name: Sentry Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, lint, test, schema]
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Skip if Sentry not configured
        id: gate
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Sentry secrets not set — skipping release upload"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install + build backend
        if: steps.gate.outputs.skip == 'false'
        run: |
          cd backend && npm ci && npm run build
      - name: Create Sentry release
        if: steps.gate.outputs.skip == 'false'
        uses: getsentry/action-release@v1
        with:
          environment: production
          version: ${{ github.sha }}
          sourcemaps: ./backend/dist
          url_prefix: '~/dist'

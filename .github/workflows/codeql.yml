name: CodeQL

# Static analysis for TypeScript/JavaScript across the whole repo.
# Findings appear under the GitHub Security tab.
#
# Active only on the GitHub mirror; primary GitLab remote uses
# GitLab SAST (see .gitlab-ci.yml include if/when enabled).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:17 UTC (offset to avoid runner-pool spikes at :00)
    - cron: '17 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality includes the default security pack plus
          # code-quality queries (high-confidence findings only).
          queries: security-and-quality

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

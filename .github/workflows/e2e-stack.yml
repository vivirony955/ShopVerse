name: E2E Stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Boots the ephemeral CI stack (docker-compose.ci.yml) — postgres + redis
# + backend + frontend — seeds an admin + e2e products, then runs a smoke
# check that both API and frontend respond.
#
# Future tasks bolt onto this job:
#   - Task 2: Playwright step after seed
#   - Task 3: Lighthouse step after seed
#   - Task 4: k6 step after seed
#   - Task 5: /admin/plugins spec — part of Playwright run
#
# For now this job alone verifies the keystone — if it goes red, the
# downstream tasks can't run. Keep it focused on stack health.
#
# Wall time targets:
#   - First run (cold cache): ≤ 15 min
#   - Subsequent runs (warm cache): ≤ 8 min

jobs:
  stack:
    name: Ephemeral CI Stack (build + boot + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f docker-compose.ci.yml build --pull

      - name: Up stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for backend healthy
        run: |
          set -e
          for i in $(seq 1 60); do
            CID=$(docker compose -f docker-compose.ci.yml ps -q backend)
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "starting")
            echo "[$i/60] backend health: $STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::backend did not become healthy within 120s"
          docker compose -f docker-compose.ci.yml logs --tail=200 backend
          exit 1

      - name: Wait for worker healthy
        run: |
          set -e
          for i in $(seq 1 60); do
            CID=$(docker compose -f docker-compose.ci.yml ps -q worker)
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "starting")
            echo "[$i/60] worker health: $STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::worker did not become healthy within 120s"
          docker compose -f docker-compose.ci.yml logs --tail=200 worker
          exit 1

      - name: Seed admin + e2e products
        run: |
          set -e
          docker compose -f docker-compose.ci.yml exec -T backend sh -c "cd backend && node dist/src/prisma/seed.js"
          docker compose -f docker-compose.ci.yml exec -T backend sh -c "cd backend && node dist/src/prisma/e2e-seed.js"

      - name: Wait for frontend healthy
        run: |
          set -e
          for i in $(seq 1 60); do
            CID=$(docker compose -f docker-compose.ci.yml ps -q frontend)
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "starting")
            echo "[$i/60] frontend health: $STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::frontend did not become healthy within 120s"
          docker compose -f docker-compose.ci.yml logs --tail=200 frontend
          exit 1

      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:3001/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json || (echo "::error::health payload mismatch"; exit 1)
          curl -fsSI http://localhost:3000 | head -1 | grep -q '200' || (echo "::error::frontend did not return 200"; exit 1)

      - name: Idempotent seed re-run (proves no double-creation)
        run: |
          set -e
          # Re-running seeds must not error; this validates the upsert/
          # find-then-create pattern in seed.ts + e2e-seed.ts. Output of
          # both scripts already logs "already exists" on idempotent paths.
          docker compose -f docker-compose.ci.yml exec -T backend sh -c "cd backend && node dist/src/prisma/seed.js"
          docker compose -f docker-compose.ci.yml exec -T backend sh -c "cd backend && node dist/src/prisma/e2e-seed.js"

      # ─── Playwright (Task 2 / POST_W6 §1.4) ──────────────────────────────
      # Runs the 222-test suite against the running stack. Config:
      #   workers: 1, retries: 1 (per frontend/playwright.config.ts).
      # Browser cache keyed on the frontend lockfile — invalidates when
      # @playwright/test bumps and the browser bundle changes.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (Chromium only — config uses just chromium)
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # Backend URL for setup projects that hit /api directly to seed
          # auth state without going through the SSR layer.
          PLAYWRIGHT_API_URL: http://localhost:3001
        run: cd frontend && npx playwright test --reporter=line,html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # ─── Lighthouse (Task 3 / POST_W6 §4.2) ──────────────────────────────
      # Scores PLP + PDP against the running stack; gate is ±3 score points
      # + ±0.02 CLS vs frontend/lighthouse-baseline.json.
      #
      # First-activation, soft-fail — same treatment as the k6 gate below.
      # frontend/lighthouse-baseline.json is the W5.T10 PLACEHOLDER (baseUrl
      # "PLACEHOLDER", conservative scores the note says real runs exceed), and
      # check-lighthouse.js compares with a *symmetric* ±3 cap (Math.abs), so a
      # real run that beats the placeholder by >3 — or a throttled CI runner's
      # lower perf score — trips it in either direction. The real gate activates
      # once a CI-representative baseline is captured (rebaseline against a
      # staging/CI run, commit it) — then REMOVE continue-on-error here. Until
      # then this must not red the stack's hard gates (build/boot/smoke/Playwright).
      - name: Install Lighthouse runtime deps
        run: cd frontend && npm install --no-save lighthouse chrome-launcher

      - name: Run Lighthouse delta gate (first-activation, soft-fail)
        continue-on-error: true
        env:
          LIGHTHOUSE_BASE_URL: http://localhost:3000
        run: cd frontend && npm run lighthouse:check

      # ─── k6 perf regression (Task 4 / POST_W6 §4.3) ──────────────────────
      # Compares p95 + throughput vs bench/baseline.json. Cap is 5% Δ by
      # default; widen to 10% later if runner variability exceeds 5% across
      # 3 consecutive runs (PERF_ENGINEER follow-up).
      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin k6-v0.50.0-linux-amd64/k6
          k6 version

      # First-activation note: bench/baseline.json holds aggressive
      # placeholder values (~80 ms p95). The first real CI run will
      # likely exceed those and "regress." Step is marked
      # continue-on-error so the PR doesn't fail; rebaseline by running
      # `node bench/check-regression.js --baseline` after the run, commit
      # the new baseline.json, then REMOVE continue-on-error in a
      # follow-up PR. After that, k6 regressions are blocking.
      - name: Run k6 regression gate (first-activation, soft-fail)
        continue-on-error: true
        env:
          BENCH_BASE_URL: http://localhost:3001
        run: node bench/check-regression.js

      - name: Dump container state on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --tail=300

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans

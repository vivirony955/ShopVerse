name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Frontend CI: type safety, lint, unit tests (jest-axe + future Jest
# additions), bundle/hydration/plugin-memory budgets, and the Lighthouse
# delta gate (self-skips until LIGHTHOUSE_BASE_URL is set repo-side).
#
# Renamed from `frontend-budget.yml` because the scope is broader than
# budgets now. Old workflow file deleted; branch protection rules must
# reference the new job names.

jobs:
  typecheck:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build sdk-frontend (file:../packages/sdk-frontend needs dist/)
        run: cd packages/sdk-frontend && npm ci && npx tsc
      - name: Install frontend deps
        run: cd frontend && npm ci
      # jest + jest-axe + @testing-library/react + @types/jest live in
      # the repo-root package.json (W5.T5 dual-React workaround). Without
      # this root install, `tsc --noEmit` sees jest.setup.ts + the
      # __tests__/ files in the include glob and fails resolving them.
      - name: Install root deps (jest + RTL hoisted)
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      # Test files are excluded from the build tsconfig (so `next build` /
      # Docker don't need jest-axe etc.); type-check them separately here.
      - name: TypeScript check (tests)
        run: cd frontend && npx tsc -p tsconfig.tests.json --noEmit

  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build sdk-frontend
        run: cd packages/sdk-frontend && npm ci && npx tsc
      - name: Install frontend deps
        run: cd frontend && npm ci
      # Root install for the same hoisted deps `next lint` walks into
      # when it scans test files alongside src/.
      - name: Install root deps (jest + RTL hoisted)
        run: npm install --no-audit --no-fund
      - name: next lint
        run: cd frontend && npm run lint -- --max-warnings=0

  unit-tests:
    name: Frontend Jest (a11y + units)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build sdk-frontend
        run: cd packages/sdk-frontend && npm ci && npx tsc
      - name: Install frontend deps
        run: cd frontend && npm ci
      # jest + jest-axe are hoisted to the repo root (npm 9+ dual-React
      # workaround locked in W5.T5 — see frontend/jest.config.js
      # moduleNameMapper pinning react/react-dom to frontend/node_modules).
      - name: Install root deps (jest + RTL hoisted)
        run: npm install --no-audit --no-fund
      - name: Run Jest
        run: cd frontend && npm test

  bundle-size:
    name: W5.T2 — Bundle Size Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build sdk-frontend (file:../packages/sdk-frontend needs dist/)
        run: cd packages/sdk-frontend && npm ci && npx tsc
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Bundle size budget gate
        run: cd frontend && npm run bundle:check
      - name: Hydration weight per-page gate
        run: cd frontend && npm run hydration:check
      - name: Per-plugin memory budget gate
        run: cd frontend && npm run plugin-memory:check

  lighthouse:
    name: W5.T10 — Lighthouse Delta Gate (scaffolded)
    runs-on: ubuntu-latest
    # Activated when staging URL is provisioned (POST_W6 §4.1). Until
    # then the script self-skips (exit 0) when LIGHTHOUSE_BASE_URL is
    # unset — see frontend/scripts/check-lighthouse.js.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Lighthouse delta gate
        run: cd frontend && npm run lighthouse:check
        env:
          LIGHTHOUSE_BASE_URL: ${{ vars.LIGHTHOUSE_BASE_URL }}

{{/*
Render an in-chart Secret ONLY when .Values.secrets.external is false.

When external=true, the operator is expected to create the Secret out-of-band
(via SealedSecrets, ExternalSecrets operator, kubectl create secret, Vault
Agent injector, etc.). Backend/worker deployments reference whichever Secret
name `shopverse.secretName` resolves to.
*/}}
{{- if not .Values.secrets.external -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shopverse.secretName" . }}
  labels:
    {{- include "shopverse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if and (ne $key "external") (ne $key "existingSecretName") $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}

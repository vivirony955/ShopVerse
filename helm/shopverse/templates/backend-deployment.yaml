{{- if .Values.backend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopverse.fullname" . }}-backend
  labels:
    {{- include "shopverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.backend.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shopverse.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shopverse.backendSelectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "shopverse.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "shopverse.backendImage" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # CMD is set in the Dockerfile (node dist/main). Explicit here so
          # operators can see what runs without reading the image.
          command: ["sh", "-c"]
          args:
            - "cd backend && node dist/main"
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
          env:
            # When workers are split into their own deployment, the backend
            # pauses its own BullMQ consumers (still produces to the queue).
            - name: DISABLE_WORKERS
              value: {{ ternary "true" "" .Values.workers.enabled | quote }}
            # Always identify itself distinctly in OTel traces.
            - name: OTEL_SERVICE_NAME
              value: shopverse-backend
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "shopverse.commonEnv" . | nindent 10 }}
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}

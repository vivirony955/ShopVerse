stages:
  - install
  - test
  - build

install_dependencies:
  stage: install
  script:
    - cd frontend && npm install
    - cd ../backend && npm install

run_tests:
  stage: test
  script:
    - cd frontend && npm run test
    - cd ../backend && npm run test

build_projects:
  stage: build
  script:
    - cd frontend && npm run build
    - cd ../backend && npm run build
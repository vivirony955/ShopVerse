version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
    command: npm install && npm run dev
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/myntra_clone
      - JWT_SECRET=your_jwt_secret
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "npm install && npm run start:dev"]
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myntra_clone
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test-backend:
    build:
      context: ./backend
    command: ["npm", "run", "test"]
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    environment:
      - NODE_ENV=test
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  test-frontend:
    build:
      context: ./frontend
    command: ["npx", "cypress", "run"]
    volumes:
      - ./frontend:/app
    depends_on:
      - frontend
    environment:
      - NODE_ENV=test
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data: